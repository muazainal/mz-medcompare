{% extends 'medicines/base.html' %}

{% block title %}Success | MedCompare{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="card glass-container shadow-lg border-0 py-5 px-4" style="border-radius: 24px;">
            <div class="card-body">
                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle shadow-sm"
                        style="width: 80px; height: 80px;">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                    </div>
                </div>

                <h1 class="fw-bold mb-3 custom-text-primary">Payment Successful!</h1>
                <p class="text-muted fs-5 mb-5">
                    Thank you for your trust. Your transaction has been verified and processed successfully.
                </p>

                <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                    <a href="{% url 'home' %}" class="btn custom-bg-primary btn-lg px-4 fw-bold rounded-pill">
                        <i class="bi bi-药品-list me-2"></i> Back to Medicine List
                    </a>
                    <a href="{% url 'my_orders' %}" class="btn btn-outline-primary btn-lg px-4 fw-bold rounded-pill">
                        <i class="bi bi-receipt me-2"></i> View Order History
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
