{% extends 'medicines/base.html' %}

{% block title %}{{ medicine.name }} | MedCompare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0" style="border-radius: 15px;">
            <div class="card-body p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-primary mb-0">{{ medicine.name }}</h2>
                    <span class="badge bg-primary rounded-pill px-3">Medicine</span>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="text-muted small fw-bold text-uppercase">Formula</label>
                        <p class="fs-5">{{ medicine.formula }}</p>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="text-muted small fw-bold text-uppercase">Dosage</label>
                        <p class="fs-5">{{ medicine.dosage }}</p>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="text-muted small fw-bold text-uppercase">Manufacturer</label>
                    <p class="fs-5">{{ medicine.manufacturer.name }}</p>
                </div>

                <div class="mb-4">
                    <label class="text-muted small fw-bold text-uppercase">Address</label>
                    <p class="fs-5">{{ medicine.manufacturer.address }}</p>
                </div>

                <hr class="my-4 opacity-10">

                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                        &larr; Back to List
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
